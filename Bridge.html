<!DOCTYPE html><html><head><meta charset="utf-8"></head><body><script>
(function(){
  const nonce=<?!= JSON.stringify(nonce) ?>;
  const origin=<?!= JSON.stringify(parentOrigin) ?>;
  const allowed=['ownerSession','ownerLogin','jobs','changeStatus','preview','replacePendingImage'];
  if(!/^https:\/\/[a-z0-9.-]+(?::\d+)?$/i.test(origin))return;
  parent.postMessage({bridge:'shopstudio',nonce:nonce,kind:'ready'},origin);
  addEventListener('message',function(event){
    if(event.source!==parent||event.origin!==origin)return;
    const d=event.data||{};
    if(d.bridge!=='shopstudio'||d.nonce!==nonce||d.kind!=='call'||!allowed.includes(d.method))return;
    const reply=(ok,value,error)=>parent.postMessage({bridge:'shopstudio',nonce:nonce,kind:'result',id:d.id,ok:ok,value:value,error:error},origin);
    try{google.script.run.withSuccessHandler(v=>reply(true,v,null)).withFailureHandler(e=>reply(false,null,String(e.message||e)))[d.method].apply(null,Array.isArray(d.args)?d.args:[])}catch(e){reply(false,null,String(e.message||e))}
  });
})();
</script></body></html>
