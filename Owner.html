<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop Studio | QR Print Orders</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f4f6ff;font:16px/1.5 system-ui,Segoe UI,sans-serif}.wrap{padding:12px;max-width:100%}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 12px}.toolbar h1{font-size:23px;margin:0}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}select,button{font:inherit;border-radius:10px;padding:10px 12px}select{min-width:190px;background:#17223d;color:white;border:1px solid #465574}button{background:#a38bff;color:#10152a;border:0;font-weight:800;cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #cbbfff;outline-offset:2px}.muted{color:#aab7d2;font-size:13px;margin:5px 0 10px}.framewrap{height:calc(100vh - 76px);min-height:590px;border:1px solid #344361;border-radius:14px;overflow:auto;background:#0b1020}iframe{display:block;border:0;width:100%;min-width:800px;min-height:1500px;background:#0b1020}#qrPanel{padding:16px;border:1px solid #344361;border-radius:12px;background:#151e37;margin:12px 0}#qrCode{display:inline-block;background:#fff;padding:10px;border-radius:8px}a{color:#b9c9ff;overflow-wrap:anywhere}[hidden]{display:none!important}@media(max-width:650px){.toolbar h1{font-size:20px}.framewrap{height:75vh}.wrap{padding:8px}}
 .toolbar-label{font-weight:750;font-size:17px;color:#e7ebff}.toolbar{padding:2px 4px 8px}.wrap{padding:8px}.framewrap{border-radius:12px}
</style><script src="shopstudio-config.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script></head><body>
<main class="wrap"><div class="toolbar"><div class="toolbar-label">Manage orders</div><div class="controls"><label for="ownerAction">Options</label><select id="ownerAction"><option value="refresh">Refresh orders</option><option value="qr">Show / hide customer QR</option><option value="customer">Open customer upload</option><option value="full">Open owner full screen</option></select><button id="go" type="button">Go →</button></div></div>
<section id="qrPanel" hidden><div id="qrCode"></div><p><a id="qrLink" target="_blank" rel="noopener"></a></p></section>
<div id="consoleViewport" class="framewrap"><iframe id="ownerConsole" title="Shop Studio owner orders" referrerpolicy="strict-origin-when-cross-origin" src="https://script.google.com/macros/s/AKfycbzKNYkCnIX7JamFiDF_Ipk7ymmO3fMgwmt7rXeFnCOqEj-IFQ-DBE_xyrttk55mTjiswQ/exec?page=owner"></iframe></div><p id="notice" class="muted" role="status" hidden></p></main>
<script>
'use strict';const $=id=>document.getElementById(id);
const ownerUrl='https://script.google.com/macros/s/AKfycbzKNYkCnIX7JamFiDF_Ipk7ymmO3fMgwmt7rXeFnCOqEj-IFQ-DBE_xyrttk55mTjiswQ/exec?page=owner';
const customerUrl=new URL('Customer.html',location.href).href;
$('qrLink').href=customerUrl;$('qrLink').textContent=customerUrl;
let qrDrawn=false;
function fit(){const vp=$('consoleViewport'),frame=$('ownerConsole');frame.style.width=Math.max(800,vp.clientWidth)+'px';requestAnimationFrame(()=>{vp.scrollLeft=vp.scrollWidth-vp.clientWidth})}
window.addEventListener('resize',fit);$('ownerConsole').addEventListener('load',fit);fit();
$('go').onclick=()=>{const action=$('ownerAction').value;
if(action==='refresh'){$('ownerConsole').src=ownerUrl+'&reload='+Date.now();$('notice').textContent='Refreshing orders…';return}
if(action==='qr'){const panel=$('qrPanel');panel.hidden=!panel.hidden;if(!panel.hidden&&!qrDrawn){if(window.QRCode){new QRCode($('qrCode'),{text:customerUrl,width:190,height:190,correctLevel:QRCode.CorrectLevel.M});qrDrawn=true}else{$('qrCode').textContent='QR library unavailable; use the customer link.'}}return}
if(action==='customer'){window.open(customerUrl,'_blank','noopener');return}
if(action==='full'){window.open(ownerUrl,'_blank','noopener')}
};
</script></body></html>
